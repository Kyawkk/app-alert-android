name: Release

# Push a tag such as v1.0.0 to build, sign and publish a GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the real release key from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "TEST_KEY=false" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets found. Using a throwaway TEST key; this build cannot update installs signed with a different key."
            STORE_PASSWORD=$(openssl rand -hex 16)
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=test
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=App Alert Test"
            echo "TEST_KEY=true" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "SIGNING_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK and AAB
        run: |
          NAME="${VERSION#v}"
          ./gradlew assembleRelease bundleRelease \
            -PappVersionName="$NAME" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/app-alert-${VERSION}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/app-alert-${VERSION}.aab"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION}.txt"
          fi
          # read by the in-app updater
          SHA=$(sha256sum "dist/app-alert-${VERSION}.apk" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","apk":"app-alert-%s.apk","sha256":"%s"}\n' \
            "${{ github.run_number }}" "${VERSION#v}" "${VERSION}" "$SHA" > dist/update.json
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "dist/app-alert-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || env.TEST_KEY == 'true' }}
          body: ${{ env.TEST_KEY == 'true' && 'Signed with a throwaway test key (no release secrets configured). For testing only.' || '' }}
