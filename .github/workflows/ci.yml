name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/ci.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          else
            STORE_PASSWORD=$(openssl rand -hex 16)
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS=ci
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=App Alert CI"
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "SIGNING_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK (R8 shrunk)
        run: >
          ./gradlew assembleRelease
          -PappVersionName=1.0.${{ github.run_number }}
          -PappVersionCode=${{ github.run_number }}

      - name: Release size report
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          {
            echo "### Release APK size"
            echo "\`$(basename "$APK")\`: **$(du -h "$APK" | cut -f1)**"
            echo
            echo "Largest entries (compressed bytes):"
            echo '```'
            unzip -lv "$APK" | awk 'NR>3 {print $3, $8}' | sort -n -r | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload release APK (test-signed)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"
          APK=$(ls dist/*.apk | head -n 1)
          cp "$APK" "dist/app-alert-$TAG.apk"

          # read by the in-app updater
          SHA=$(sha256sum "dist/app-alert-$TAG.apk" | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"1.0.%s","apk":"app-alert-%s.apk","sha256":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$TAG" "$SHA" > dist/update.json

          gh release create "$TAG" "dist/app-alert-$TAG.apk" dist/update.json \
            --target "${{ github.sha }}" \
            --latest \
            --title "App Alert $TAG" \
            --generate-notes

          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tagName, isDraft, isPrerelease, assets: [.assets[].name]}'
